        .name-group { grid-column: 1 / 2; }
        .info-label { margin-right: 5px; font-weight: bold; color: #004085; white-space: nowrap; }

            position: relative;
            z-index: 2;
            border: 1px solid #b8d4f0;

            max-width: 100%; height: auto; max-height: 220px;
            object-fit: cover;
            margin: 12px 0 16px 0;
            border-radius: 8px;
            box-shadow: 4px 4px 8px rgba(0,0,0,0.2);
            border: 1px solid #a0c4e0;
            display: block;
        }
        .options { margin-top: 5px; }
        .option {
            margin-bottom: 10px; padding: 12px;
            background: linear-gradient(145deg, #ffffff, #f0f0f0);
            border-radius: 8px; border: 1px solid #d0d0d0;
            cursor: pointer; transition: all 0.3s ease;
            box-shadow: 4px 4px 8px rgba(0,0,0,0.1), -4px -4px 8px rgba(255,255,255,0.7);
            display: flex; align-items: flex-start;
            line-height: 1.4;
        }

            background: linear-gradient(145deg, #f5f5f5, #e8e8e8);
            transform: translateY(-2px);
            box-shadow: 6px 6px 12px rgba(0,0,0,0.15), -6px -6px 12px rgba(255,255,255,0.8);
        }

            background: linear-gradient(145deg, #155724, #0f4019);

        }
        .option::before { content: attr(data-letter) "."; font-weight: bold; margin-right: 8px; flex-shrink: 0; }

            padding: 25px;
            margin-bottom: 25px;
            background: linear-gradient(145deg, #fff8e6, #ffefc0);
            border-radius: 12px;
            box-shadow: 8px 8px 16px #b3b3b3, -8px -8px 16px #ffffff;
            position: relative;
            z-index: 2;
            border: 1px solid #f0cc70;
        }
        .dissertativa-label {

            font-weight: bold;
            text-transform: uppercase;
            color: #7a5500;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .dissertativa-question { font-weight: bold; color: #5a3e00; line-height: 1.5; margin-bottom: 14px; }

            max-width: 100%; height: auto; max-height: 200px;

            border-radius: 8px;
            box-shadow: 4px 4px 8px rgba(0,0,0,0.15);
            border: 1px solid #f0cc70;
            display: block;

        .resposta-label { font-size: 12px; font-weight: bold; color: #7a5500; margin-bottom: 6px; }

            width: 100%;
            min-height: 100px;
            padding: 12px;
            border: 1px solid #d4a800;
            border-radius: 8px;
            background: #fffdf0;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.08);
            font-size: 14px;
            color: #333;
            resize: vertical;
            line-height: 1.6;
            font-family: Arial, sans-serif;
            transition: border-color 0.2s;

        /* Botões */
        .buttons {
            display: flex; justify-content: space-between;
            margin-top: 20px; position: relative; z-index: 2; gap: 15px;
        }
        @media (max-width: 480px) { .buttons { flex-direction: column; } }
        button {
            padding: 12px 25px; border: none; border-radius: 8px;
            cursor: pointer; font-size: 16px; font-weight: bold;

            box-shadow: 6px 6px 12px rgba(0,0,0,0.2), -6px -6px 12px rgba(255,255,255,0.7);

        #clearBtn { background: linear-gradient(145deg, #6c757d, #545b62); color: white; }

/* ============================================================
   GABARITO (apenas múltipla escolha)
   ============================================================ */
const correctAnswersMap = {};
questions.filter(q => q.type === "multipla").forEach(q => {
    q.options.forEach((opt, idx) => {
        if (opt.correct) correctAnswersMap[`q${q.id}`] = String.fromCharCode(65 + idx);
    });
});

/* ============================================================
   UTILITÁRIOS
   ============================================================ */
function showResult(msg, type) {
    const el = document.getElementById("resultMessage");
    el.innerHTML = msg;
    el.className = "result " + type;
    el.style.display = "block";
    el.scrollIntoView({ behavior: "smooth", block: "nearest" });
}
function hideResult() { document.getElementById("resultMessage").style.display = "none"; }

/* ============================================================
   ENVIO PARA O GOOGLE APPS SCRIPT
   ============================================================ */
async function sendToGoogle(dataObj) {
    try {
        const response = await fetch(GOOGLE_SCRIPT_URL, { method: "POST", body: JSON.stringify(dataObj) });
        if (!response.ok) throw new Error(`Erro HTTP: ${response.status}`);
        const json = await response.json();
        if (json.status === "success") {
            showResult("<strong>Sucesso!</strong> Dados enviados e registrados.", "success");
            document.getElementById("submitBtn").disabled = true;
        } else {
            showResult("<strong>Erro no servidor:</strong> " + (json.message || "Resposta inesperada."), "error");
        }
    } catch (e) {
        showResult("<strong>Erro de Conexão:</strong> " + e.message + ". Verifique se o Apps Script está publicado como 'Qualquer pessoa'.", "error");
    }
}

/* ============================================================
   RENDERIZAÇÃO
   ============================================================ */
document.addEventListener("DOMContentLoaded", () => {
    const select   = document.getElementById("studentName");
    const num      = document.getElementById("studentNumber");
    const grade    = document.getElementById("studentGrade");
    const container = document.getElementById("questionsContainer");
    document.getElementById("currentDate").value = new Date().toLocaleDateString('pt-BR');

    // Alunos
    Object.keys(students).forEach(turma => {
        const group = document.createElement("optgroup");
        group.label = turma;
        students[turma].forEach(s => {
            const opt = document.createElement("option");
            opt.value = `${s.number}|${turma}|${s.name}`;
            opt.textContent = s.name;
            group.appendChild(opt);
        });
        select.appendChild(group);
    });

    // Contadores para numeração sequencial
    let mcCount = 0;   // múltipla escolha
    let disCount = 0;  // dissertativa

    // Separadores
    let lastType = null;

    questions.forEach(q => {

        // Separador de seção quando muda de tipo
        if (lastType !== null && lastType !== q.type) {
            const div = document.createElement("div");
            div.className = "section-divider";
            div.innerHTML = q.type === "multipla"
                ? "<span>✏️ Questões de Múltipla Escolha</span>"
                : "<span>📝 Questão Dissertativa</span>";
            container.appendChild(div);
        } else if (lastType === null) {
            const div = document.createElement("div");
            div.className = "section-divider";
            div.innerHTML = "<span>✏️ Questões de Múltipla Escolha</span>";
            container.appendChild(div);
        }
        lastType = q.type;

        /* ---------- MÚLTIPLA ESCOLHA ---------- */
        if (q.type === "multipla") {
            mcCount++;
            const block = document.createElement("div");
            block.className = "question-container";
            block.id = "q" + q.id;

            // Enunciado
            const p = document.createElement("p");
            p.className = "question";
            p.innerHTML = `<strong>${mcCount}.</strong> ${q.question}`;
            block.appendChild(p);

            // Imagem entre enunciado e alternativas
            if (q.image) {
                const img = document.createElement("img");
                img.src = q.image;
                img.alt = `Imagem da questão ${mcCount}`;
                img.className = "question-image";
                img.onerror = function() { this.style.display = "none"; };
                block.appendChild(img);
            }

            // Alternativas
            const optBox = document.createElement("div");
            optBox.className = "options";
            q.options.forEach((opt, idx) => {
                const letter = String.fromCharCode(65 + idx);
                const div = document.createElement("div");
                div.className = "option";
                div.dataset.question = q.id;
                div.dataset.letter = letter;
                div.textContent = opt.text;
                div.onclick = () => {
                    optBox.querySelectorAll(".option").forEach(o => o.classList.remove("selected"));
                    div.classList.add("selected");
                    hideResult();
                };
                optBox.appendChild(div);
            });
            block.appendChild(optBox);
            container.appendChild(block);
        }

        /* ---------- DISSERTATIVA ---------- */
        else if (q.type === "dissertativa") {
            disCount++;
            const block = document.createElement("div");
            block.className = "dissertativa-container";
            block.id = "d" + disCount;

            const label = document.createElement("div");
            label.className = "dissertativa-label";
            label.textContent = `Questão Dissertativa ${disCount}`;
            block.appendChild(label);

            const p = document.createElement("p");
            p.className = "dissertativa-question";
            p.innerHTML = `<strong>Q${disCount}.</strong> ${q.question}`;
            block.appendChild(p);

            // Imagem entre enunciado e campo de resposta
            if (q.image) {
                const img = document.createElement("img");
                img.src = q.image;
                img.alt = `Imagem dissertativa ${disCount}`;
                img.className = "dissertativa-image";
                img.onerror = function() { this.style.display = "none"; };
                block.appendChild(img);
            }

            const rl = document.createElement("div");
            rl.className = "resposta-label";
            rl.textContent = "Sua resposta:";
            block.appendChild(rl);

            const ta = document.createElement("textarea");
            ta.className = "resposta-field";
            ta.id = `resp_d${disCount}`;
            ta.placeholder = "Escreva sua resposta aqui...";
            ta.oninput = hideResult;
            block.appendChild(ta);

            container.appendChild(block);
        }
    });

    // Seleção de aluno
    select.onchange = () => {
        if (!select.value) { num.value = ""; grade.value = ""; return; }
        const [n, g] = select.value.split("|");
        num.value = n; grade.value = g;
        hideResult();
    };

    // Limpar
    document.getElementById("clearBtn").onclick = () => {
        document.querySelectorAll(".option.selected").forEach(o => o.classList.remove("selected"));
        document.querySelectorAll(".resposta-field").forEach(t => t.value = "");
        hideResult();
    };
});

/* ============================================================
   ENVIO FINAL
   ============================================================ */
document.getElementById("submitBtn").onclick = async () => {
    hideResult();

    const select = document.getElementById("studentName");
    if (!select.value) { showResult("Selecione seu nome.", "error"); return; }

    const [studentNumber, studentGrade, studentName] = select.value.split("|");
    const data = { studentName, studentNumber, studentGrade };

    const multiplas = questions.filter(q => q.type === "multipla");
    const dissertativas = questions.filter(q => q.type === "dissertativa");

    // Verificar múltipla escolha
    let correct = 0;
    let allAnswered = true;
    for (let q of multiplas) {
        const selected = document.querySelector(`#q${q.id} .option.selected`);
        if (!selected) { allAnswered = false; break; }
        const letter = selected.dataset.letter;
        data[`q${q.id}`] = letter;
        if (letter === correctAnswersMap[`q${q.id}`]) correct++;
    }
    if (!allAnswered) { showResult("Responda todas as questões de múltipla escolha antes de enviar.", "error"); return; }

    // Coletar dissertativas
    let disCount = 0;
    for (let q of dissertativas) {
        disCount++;
        const ta = document.getElementById(`resp_d${disCount}`);
        if (!ta || ta.value.trim() === "") {
            showResult(`Responda a questão dissertativa ${disCount} antes de enviar.`, "error");
            return;
        }
        data[`dissertativa${disCount}`] = ta.value.trim();
    }

    data.finalScore = correct;
    data.percentage = (correct / multiplas.length) * 100;

    showResult(`Calculando nota... você acertou ${correct}/${multiplas.length} nas questões objetivas. Enviando...`, "success");
    await sendToGoogle(data);
};
</script>
